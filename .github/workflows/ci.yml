name: CI

# 代码审查门禁：push / PR 自动跑类型检查 + Lint + 单测
on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck (node + web)
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test
